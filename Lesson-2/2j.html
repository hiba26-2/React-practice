<!DOCTYPE html>
<html>
  <head>
    <title>2i</title>
  </head>
  <body>
    <div class="js-container"></div>
<script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
     
      function ProductDetails({label,price,discountPrice,imgSrc}){
      
        return (
          
          <div>
            
          <img src={imgSrc} width="150" />
          <p >{label}</p>  
            {discountPrice ?(
            <>
            <p>price:<del>{price}</del></p>
            <p>Discount price:{discountPrice}</p>   
            </>):(
            <>                
            <p>price:{price}</p>
            </>
            )       
            }
             <button>Add to Cart</button>
         

        </div>
        
      );
    }



      function App(){
        return( 
            <>
          <ProductDetails
           label="Tennis balls"
            price="$6.00" 
            imgSrc="tennis-balls.png" />
          <ProductDetails 
           label="T-shirt" 
          price="$7.99" 
            imgSrc="plain-t-shirt.png"
            />
          <ProductDetails 
          label="Cotton socks"
           price="$10.90" 
           discountPrice="$5.45"
             imgSrc="cotton-socks.png"
             />
          </>
        );
      }
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
