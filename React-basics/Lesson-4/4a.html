<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
        .on-btn-class{
            background-color: rgb(25,135,84);
            border:none;
            border-radius: 10px;
            padding:10px 15px;
            color:white;
            cursor: pointer;
        }
        .off-btn-class{
            background-color: rgb(220,53,69);
            border:none;
            border-radius: 10px;
            padding:10px 15px;
            color:white;
            cursor: pointer;
        }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
<script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    function App(){
        const[isButtonOn,setisButtonOn]=React.useState(false);
     function change(){
        if(isButtonOn===false){
  setisButtonOn(true);

        }else{
  setisButtonOn(false);
  button.classList
        }
      
        
     }
    
        return(
            <>
                <button className={isButtonOn?"on-btn-class":"off-btn-class"} onClick={change}>{isButtonOn?"ON":"OFF" }</button>
            </>
        );
    }
  
      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
